<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>BossBePro</title>
    <script>
      // Apply saved theme before first paint to avoid a white flash in dark mode.
      try {
        var t = localStorage.getItem('bepro.theme');
        if (t === 'dark') document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    </script>
    <style>
      /* Shown from the very first frame until the app has loaded: the theme's background and the logo, never a black screen. */
      html, body { margin: 0; background: #ececec; }
      html[data-theme='dark'], html[data-theme='dark'] body { background: #2a2a2c; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; }
      .boot img { width: 72px; height: 72px; border-radius: 18px; animation: boot-in 0.6s ease both; }
      @keyframes boot-in { from { opacity: 0; transform: scale(0.94); } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot"><img src="./favicon.svg" alt="BossBePro" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
